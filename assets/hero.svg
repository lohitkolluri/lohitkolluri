<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="100%" height="auto">
  <defs>
    <style>
      @keyframes fadeIn {
        0% { opacity: 0; transform: translateY(12px); }
        100% { opacity: 1; transform: translateY(0); }
      }
      @keyframes drawLine {
        0% { stroke-dashoffset: 840; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes typeLine1 {
        0% { width: 0; }
        100% { width: 520; }
      }
      @keyframes typeLine2 {
        0% { width: 0; }
        100% { width: 510; }
      }
      @keyframes typeLine3 {
        0% { width: 0; }
        100% { width: 270; }
      }
      @keyframes blink {
        0%, 45% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      .name { animation: fadeIn 1s ease-out forwards; }
      .top-line { stroke-dasharray: 840; animation: drawLine 0.8s ease-out 0.3s forwards; opacity: 0; }
      .type-rect-1 { animation: typeLine1 2.5s steps(48) 1.2s forwards; }
      .type-rect-2 { animation: typeLine2 2.5s steps(48) 3.9s forwards; }
      .type-rect-3 { animation: typeLine3 1.5s steps(23) 6.6s forwards; }
      .bottom-line { stroke-dasharray: 840; animation: drawLine 0.8s ease-out 8.3s forwards; opacity: 0; }
      .cursor { animation: blink 1s step-end 8.5s infinite; opacity: 0; }
    </style>

    <clipPath id="clip-1"><rect class="type-rect-1" x="190" y="155" width="0" height="24" /></clipPath>
    <clipPath id="clip-2"><rect class="type-rect-2" x="195" y="182" width="0" height="24" /></clipPath>
    <clipPath id="clip-3"><rect class="type-rect-3" x="315" y="209" width="0" height="24" /></clipPath>
  </defs>

  <!-- Background -->
  <rect width="900" height="280" fill="#0a0a0a" rx="0" />

  <!-- Top decorative line -->
  <line class="top-line" x1="30" y1="50" x2="870" y2="50" stroke="#2a2a2a" stroke-width="1" />

  <!-- Name -->
  <text class="name" x="450" y="128" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="700" letter-spacing="-0.5" opacity="0">Lohit Kolluri</text>

  <!-- Tagline 1 -->
  <g>
    <text x="450" y="173" text-anchor="middle" fill="#888888" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" clip-path="url(#clip-1)">Platform Engineer · Cloud &amp; Infrastructure</text>
  </g>

  <!-- Tagline 2 -->
  <g>
    <text x="450" y="200" text-anchor="middle" fill="#888888" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" clip-path="url(#clip-2)">Building reliable and observable systems</text>
  </g>

  <!-- Tagline 3 -->
  <g>
    <text x="450" y="227" text-anchor="middle" fill="#888888" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" clip-path="url(#clip-3)">Open Source Contributor</text>
  </g>

  <!-- Blinking cursor -->
  <rect class="cursor" x="588" y="212" width="2" height="22" fill="#ffffff" rx="1" />

  <!-- Bottom decorative line -->
  <line class="bottom-line" x1="30" y1="252" x2="870" y2="252" stroke="#2a2a2a" stroke-width="1" />
</svg>
