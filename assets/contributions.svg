<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="auto">
  <defs>
    <style>
      @keyframes fadeSlide {
        0% { opacity: 0; transform: translateY(6px); }
        100% { opacity: 1; transform: translateY(0); }
      }
      @keyframes drawLine {
        0% { stroke-dashoffset: 840; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes dotPop {
        0% { r: 0; opacity: 0; }
        100% { r: 3.5; opacity: 1; }
      }
      .hline { stroke-dasharray: 840; animation: drawLine 0.5s ease-out 0.1s forwards; stroke-opacity: 0; }
      .ttl { animation: fadeSlide 0.4s ease-out 0.25s both; }
      .r1 { animation: fadeSlide 0.3s ease-out 0.4s both; } .d1 { animation: dotPop 0.25s ease-out 0.45s both; }
      .r2 { animation: fadeSlide 0.3s ease-out 0.55s both; } .d2 { animation: dotPop 0.25s ease-out 0.6s both; }
      .r3 { animation: fadeSlide 0.3s ease-out 0.7s both; } .d3 { animation: dotPop 0.25s ease-out 0.75s both; }
      .r4 { animation: fadeSlide 0.3s ease-out 0.85s both; } .d4 { animation: dotPop 0.25s ease-out 0.9s both; }
      .r5 { animation: fadeSlide 0.3s ease-out 1.0s both; } .d5 { animation: dotPop 0.25s ease-out 1.05s both; }
      .r6 { animation: fadeSlide 0.3s ease-out 1.15s both; } .d6 { animation: dotPop 0.25s ease-out 1.2s both; }
      .r7 { animation: fadeSlide 0.3s ease-out 1.3s both; } .d7 { animation: dotPop 0.25s ease-out 1.35s both; }
      .r8 { animation: fadeSlide 0.3s ease-out 1.45s both; } .d8 { animation: dotPop 0.25s ease-out 1.5s both; }
      .r9 { animation: fadeSlide 0.3s ease-out 1.6s both; } .d9 { animation: dotPop 0.25s ease-out 1.65s both; }
      .r10 { animation: fadeSlide 0.3s ease-out 1.75s both; } .d10 { animation: dotPop 0.25s ease-out 1.8s both; }
      .r11 { animation: fadeSlide 0.3s ease-out 1.9s both; } .d11 { animation: dotPop 0.25s ease-out 1.95s both; }
      .r12 { animation: fadeSlide 0.3s ease-out 2.05s both; } .d12 { animation: dotPop 0.25s ease-out 2.1s both; }
    </style>
  </defs>

  <rect width="900" height="480" fill="transparent" />

  <line class="hline" x1="30" y1="20" x2="870" y2="20" stroke="#30363d" stroke-width="1" />

  <text class="ttl" x="30" y="55" fill="#e6edf3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="600" opacity="0">Contributions</text>

  <!-- Row 1: Docker CLI -->
  <g class="r1">
    <circle class="d1" cx="36" cy="82" r="0" fill="#2496ED" />
    <text x="52" y="86" fill="#e6edf3" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">Docker CLI</text>
    <text x="165" y="86" fill="#8b949e" font-family="system-ui, -apple-system, sans-serif" font-size="13">Add private registry pull/push e2e test</text>
    <text x="870" y="86" fill="#58a6ff" font-family="system-ui, -apple-system, sans-serif" font-size="12" text-anchor="end">#7007</text>
    <line x1="30" y1="96" x2="870" y2="96" stroke="#21262d" stroke-width="1" />
  </g>

  <!-- Row 2: Docker / Moby -->
  <g class="r2">
    <circle class="d2" cx="36" cy="114" r="0" fill="#2496ED" />
    <text x="52" y="118" fill="#e6edf3" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">Docker / Moby</text>
    <text x="165" y="118" fill="#8b949e" font-family="system-ui, -apple-system, sans-serif" font-size="13">Fix Swarm constraint scheduling for completed tasks</text>
    <text x="870" y="118" fill="#58a6ff" font-family="system-ui, -apple-system, sans-serif" font-size="12" text-anchor="end">#52786</text>
    <line x1="30" y1="128" x2="870" y2="128" stroke="#21262d" stroke-width="1" />
  </g>

  <!-- Row 3: SwarmKit -->
  <g class="r3">
    <circle class="d3" cx="36" cy="146" r="0" fill="#2496ED" />
    <text x="52" y="150" fill="#e6edf3" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">SwarmKit</text>
    <text x="165" y="150" fill="#8b949e" font-family="system-ui, -apple-system, sans-serif" font-size="13">Correct resource reservation for completed tasks</text>
    <text x="870" y="150" fill="#58a6ff" font-family="system-ui, -apple-system, sans-serif" font-size="12" text-anchor="end">#3237</text>
    <line x1="30" y1="160" x2="870" y2="160" stroke="#21262d" stroke-width="1" />
  </g>

  <!-- Row 4: Helm -->
  <g class="r4">
    <circle class="d4" cx="36" cy="178" r="0" fill="#0F1689" />
    <text x="52" y="182" fill="#e6edf3" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">Helm</text>
    <text x="165" y="182" fill="#8b949e" font-family="system-ui, -apple-system, sans-serif" font-size="13">Reproducible archives via SOURCE_DATE_EPOCH</text>
    <text x="870" y="182" fill="#58a6ff" font-family="system-ui, -apple-system, sans-serif" font-size="12" text-anchor="end">#32162</text>
    <line x1="30" y1="192" x2="870" y2="192" stroke="#21262d" stroke-width="1" />
  </g>

  <!-- Row 5: Prometheus -->
  <g class="r5">
    <circle class="d5" cx="36" cy="210" r="0" fill="#E6522C" />
    <text x="52" y="214" fill="#e6edf3" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">Prometheus</text>
    <text x="165" y="214" fill="#8b949e" font-family="system-ui, -apple-system, sans-serif" font-size="13">AWS SD init fix &amp; TSDB retention docs</text>
    <text x="870" y="214" fill="#58a6ff" font-family="system-ui, -apple-system, sans-serif" font-size="12" text-anchor="end">#19037 +</text>
    <line x1="30" y1="224" x2="870" y2="224" stroke="#21262d" stroke-width="1" />
  </g>

  <!-- Row 6: Prometheus Operator -->
  <g class="r6">
    <circle class="d6" cx="36" cy="242" r="0" fill="#E6522C" />
    <text x="52" y="246" fill="#e6edf3" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">Prometheus Operator</text>
    <text x="165" y="246" fill="#8b949e" font-family="system-ui, -apple-system, sans-serif" font-size="13">Validation, docs, linting &amp; test coverage</text>
    <text x="870" y="246" fill="#58a6ff" font-family="system-ui, -apple-system, sans-serif" font-size="12" text-anchor="end">#8587 +</text>
    <line x1="30" y1="256" x2="870" y2="256" stroke="#21262d" stroke-width="1" />
  </g>

  <!-- Row 7: CockroachDB -->
  <g class="r7">
    <circle class="d7" cx="36" cy="274" r="0" fill="#6933FF" />
    <text x="52" y="278" fill="#e6edf3" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">CockroachDB</text>
    <text x="165" y="278" fill="#8b949e" font-family="system-ui, -apple-system, sans-serif" font-size="13">SQL optimizer metamorphic defaults</text>
    <text x="870" y="278" fill="#58a6ff" font-family="system-ui, -apple-system, sans-serif" font-size="12" text-anchor="end">#170882</text>
    <line x1="30" y1="288" x2="870" y2="288" stroke="#21262d" stroke-width="1" />
  </g>

  <!-- Row 8: Apache Airflow -->
  <g class="r8">
    <circle class="d8" cx="36" cy="306" r="0" fill="#017CEE" />
    <text x="52" y="310" fill="#e6edf3" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">Apache Airflow</text>
    <text x="165" y="310" fill="#8b949e" font-family="system-ui, -apple-system, sans-serif" font-size="13">API reliability during SQLite lock contention</text>
    <text x="870" y="310" fill="#58a6ff" font-family="system-ui, -apple-system, sans-serif" font-size="12" text-anchor="end">#67900</text>
    <line x1="30" y1="320" x2="870" y2="320" stroke="#21262d" stroke-width="1" />
  </g>

  <!-- Row 9: Jenkins -->
  <g class="r9">
    <circle class="d9" cx="36" cy="338" r="0" fill="#D24939" />
    <text x="52" y="342" fill="#e6edf3" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">Jenkins</text>
    <text x="165" y="342" fill="#8b949e" font-family="system-ui, -apple-system, sans-serif" font-size="13">Workspace encoding &amp; credential error handling</text>
    <text x="870" y="342" fill="#58a6ff" font-family="system-ui, -apple-system, sans-serif" font-size="12" text-anchor="end">#26912 +</text>
    <line x1="30" y1="352" x2="870" y2="352" stroke="#21262d" stroke-width="1" />
  </g>

  <!-- Row 10: Docker Model Runner -->
  <g class="r10">
    <circle class="d10" cx="36" cy="370" r="0" fill="#2496ED" />
    <text x="52" y="374" fill="#e6edf3" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">Docker Model Runner</text>
    <text x="165" y="374" fill="#8b949e" font-family="system-ui, -apple-system, sans-serif" font-size="13">CUDA support for Pascal GPUs</text>
    <text x="870" y="374" fill="#58a6ff" font-family="system-ui, -apple-system, sans-serif" font-size="12" text-anchor="end">#986</text>
    <line x1="30" y1="384" x2="870" y2="384" stroke="#21262d" stroke-width="1" />
  </g>

  <!-- Row 11: Argo CD -->
  <g class="r11">
    <circle class="d11" cx="36" cy="402" r="0" fill="#EF7B4D" />
    <text x="52" y="406" fill="#e6edf3" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">Argo CD</text>
    <text x="165" y="406" fill="#8b949e" font-family="system-ui, -apple-system, sans-serif" font-size="13">Parallelized unit test execution</text>
    <text x="870" y="406" fill="#58a6ff" font-family="system-ui, -apple-system, sans-serif" font-size="12" text-anchor="end">#28177</text>
    <line x1="30" y1="416" x2="870" y2="416" stroke="#21262d" stroke-width="1" />
  </g>

  <!-- Row 12: Grafana -->
  <g class="r12">
    <circle class="d12" cx="36" cy="434" r="0" fill="#F46800" />
    <text x="52" y="438" fill="#e6edf3" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">Grafana</text>
    <text x="165" y="438" fill="#8b949e" font-family="system-ui, -apple-system, sans-serif" font-size="13">Modal border color bleeding fix</text>
    <text x="870" y="438" fill="#58a6ff" font-family="system-ui, -apple-system, sans-serif" font-size="12" text-anchor="end">#125797</text>
  </g>
</svg>
